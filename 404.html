<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Page not found &middot; Liquid &amp; Larder Team Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gilda+Display&family=Montserrat:wght@400;500;600;700&display=swap" />
  <!-- Theme: resolve BEFORE the stylesheets load, so a dark page never shows a light
       frame. "ll-theme" holds the user's choice (system | light | dark); data-theme on
       <html> holds what that resolved to. Kept inline and tiny on purpose — an external
       file would be a second round trip in front of first paint. Paired with
       /scripts/hub-motion.js, which draws the control and writes the preference. -->
  <script>!function(){try{var p=localStorage.getItem("ll-theme")||"system",d=p==="dark"||p!=="light"&&matchMedia("(prefers-color-scheme: dark)").matches;var r=document.documentElement;r.setAttribute("data-theme",d?"dark":"light");r.setAttribute("data-theme-pref",p)}catch(e){document.documentElement.setAttribute("data-theme","light")}}();</script>
  <link rel="stylesheet" href="/styles/core.css?v=7" />
  <link rel="stylesheet" href="/styles/hub.css?v=8" />
  <script defer src="/scripts/hub-motion.js?v=2"></script>
  <style>
    body { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
    .login { width:100%; max-width:430px; padding:40px 40px 32px; border-radius:22px; margin:0; animation:rise .55s ease both; text-align:left; }
    @keyframes rise { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }
    .loginBrand { display:flex; flex-direction:column; gap:6px; margin-bottom:22px; }
    .loginBrand .wordmark { font-family:'Gilda Display',serif; font-size:22px; color:var(--accent-ink); letter-spacing:.02em; }
    .loginBrand .sub { font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--dim); }
    .code404 { font-size:12px; letter-spacing:.18em; text-transform:uppercase; color:var(--err); margin-bottom:10px; }
    h2 { font-family:'Gilda Display',serif; font-weight:400; font-size:24px; color:var(--accent-ink); margin-bottom:8px; }
    .lead { color:var(--dim); font-size:12.5px; line-height:1.7; margin-bottom:24px; }
    .divider { height:1px; background:var(--hairline); margin:24px 0; }
    .signHead { font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--dim); margin-bottom:16px; }
    .field { margin-bottom:16px; }
    .field label { display:block; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); margin-bottom:6px; }
    .field input { width:100%; font-family:'Montserrat',sans-serif; font-size:14px; color:var(--ink); background:var(--sand-soft);
      border:1px solid var(--hairline); border-radius:var(--r-input); padding:12px 14px; outline:none; transition:box-shadow .15s, border-color .15s; }
    .field input:focus { border-color:var(--accent-ink); box-shadow:var(--ring); }
    #signin { width:100%; padding:13px 22px; margin-top:4px; }
    .forgotRow { text-align:center; margin-top:16px; }
    button.ghost { background:none; box-shadow:none; color:var(--dim); text-transform:none; letter-spacing:0;
      font-weight:500; font-size:12.5px; padding:4px 8px; }
    button.ghost:hover { color:var(--accent-ink); transform:none; filter:none; }
    .msg { margin-top:16px; text-align:center; min-height:18px; }
    .actions { display:flex; gap:10px; flex-wrap:wrap; }
    .actions .btnlink { flex:1; text-align:center; text-decoration:none; font-family:'Montserrat',sans-serif; font-weight:600;
      letter-spacing:.06em; font-size:13px; padding:13px 18px; border-radius:999px; }
    .btnlink.primary { background:linear-gradient(180deg,var(--green-hi),var(--green)); color:var(--on-accent); box-shadow:var(--shadow-btn); }
    .btnlink.secondary { background:var(--sand-soft); color:var(--accent-ink); border:1px solid var(--hairline); }
    .loginFoot { display:flex; align-items:center; gap:8px; justify-content:center; margin-top:24px; color:var(--dim); font-size:11px; }
    .loginFoot svg { width:14px; height:14px; fill:none; stroke:currentColor; stroke-width:1.6; }
  </style>
</head>
<body>
  <main class="card login">
    <div class="loginBrand">
      <div class="wordmark">Liquid &amp; Larder</div>
      <div class="sub">Team Hub</div>
    </div>

    <p class="code404">Error 404</p>
    <h2>We couldn't find that page</h2>
    <p class="lead">The page you're after may have moved or no longer exists. If you're not signed in, you can sign in below and we'll take you back to the hub.</p>

    <!-- SIGNED OUT -->
    <div id="signedOut" style="display:none;">
      <div class="divider"></div>
      <div class="signHead">Sign in</div>
      <div class="field"><label>Email</label><input id="email" type="email" autocomplete="username" placeholder="you@liquidandlarder.com.au"></div>
      <div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div>
      <button id="signin">Sign in</button>
      <div class="forgotRow"><button class="ghost" id="forgot">Forgot password</button></div>
      <div class="msg" id="loginMsg"></div>
    </div>

    <!-- SIGNED IN -->
    <div id="signedIn" style="display:none;">
      <div class="divider"></div>
      <div class="actions">
        <a class="btnlink primary" href="/">Go to the Team Hub</a>
        <a class="btnlink secondary" href="/">Home</a>
      </div>
    </div>

    <div class="loginFoot">
      <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
      Access is by invitation only
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
  (function(){
    var SB_URL = 'https://lkoqyllmtoodthrtjgfm.supabase.co', SB_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxrb3F5bGxtdG9vZHRocnRqZ2ZtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM0MjI4MDAsImV4cCI6MjA5ODk5ODgwMH0.xdPjk-z2HvvLc-mw9b3buZ9Hj1I1ykXFy6cFtRr1isg';
    var sb = window.supabase.createClient(SB_URL, SB_ANON);
    var $ = function(id){ return document.getElementById(id); };
    function msg(t, cls){ var m=$('loginMsg'); m.textContent=t||''; m.className='msg'+(cls?' '+cls:''); }

    sb.auth.getSession().then(function(r){
      var s = r && r.data && r.data.session;
      if (s){ $('signedOut').style.display='none'; $('signedIn').style.display='block'; }
      else { $('signedIn').style.display='none'; $('signedOut').style.display='block'; try{ $('email').focus(); }catch(e){} }
    });

    function doSignIn(){
      var email=$('email').value.trim(), pw=$('password').value;
      if(!email || !pw){ msg('Enter your email and password.','err'); return; }
      $('signin').disabled=true; msg('Signing in…');
      sb.auth.signInWithPassword({ email:email, password:pw }).then(function(r){
        if(r.error){ msg(r.error.message || 'Sign in failed.','err'); $('signin').disabled=false; }
        else { msg('Signed in — taking you to the hub…','ok'); location.href='/'; }
      });
    }
    $('signin').addEventListener('click', doSignIn);
    $('email').addEventListener('keydown', function(e){ if(e.key==='Enter') doSignIn(); });
    $('password').addEventListener('keydown', function(e){ if(e.key==='Enter') doSignIn(); });

    $('forgot').addEventListener('click', function(){
      var email=$('email').value.trim();
      if(!email){ msg('Enter your email first, then tap Forgot password.','err'); return; }
      msg('Sending reset link…');
      sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + '/' }).then(function(r){
        if(r.error) msg(r.error.message || 'Could not send reset email.','err');
        else msg('Check your email for a reset link.','ok');
      });
    });
  })();
  </script>
</body>
</html>
