         If something is missing from this list, it was not changed.</p>` : ''}
      ${d.version.source === 'docs' && d.version.source_doc_id
        ? `<p class="fieldNote" style="margin:10px 0 0"><a href="https://docs.google.com/document/d/${esc(d.version.source_doc_id)}/edit" target="_blank" rel="noopener">Open the source Doc</a> to compare.</p>` : ''}
    </div>` : ''}
    ${holes.length ? `<div class="card">
      <div class="cardTitle">Placeholders still in the text</div>
      <div class="reach"><div style="display:flex; gap:7px; flex-wrap:wrap">
        ${holes.map(h => `<span class="chip plain" style="font-family:monospace; text-transform:none; letter-spacing:0">${esc(h)}</span>`).join('')}
      </div>
      <div class="warn">Some of these are meant to stay — a merge field like [Guest first name] is filled in
        when the email is sent. Others are unfinished. Publishing a policy that still says [$XX] is worse
        than not publishing it at all, so check every one before you approve.</div></div>
    </div>` : ''}
    <div class="card">
      <div class="cardTitle">Who it reaches</div>
      <p style="font-size:12.5px; line-height:1.7">
        ${d.policy.audience_scope === 'everyone' ? '<b>Everyone</b>' : esc(hatNames.join(', ') || 'nobody')}
        ${venueNames.length ? ` at ${esc(venueNames.join(', '))}` : ' at every venue'}.
        ${d.policy.tier === 'must_know' ? ' Needs a check-off.' : ''}
      </p>
    </div>
    <div class="card">
      <div class="cardTitle">The policy</div>
      <article class="doc" id="reviewDoc">${renderBody(d.version.body, [])}</article>
    </div>
    ${d.questions.length ? `<div class="card">
      <div class="cardTitle">Check questions</div>
      <ul style="margin-left:18px">${d.questions.map(q => `<li style="font-size:13px; line-height:1.8">${esc(q.question)}</li>`).join('')}</ul>
    </div>` : ''}
    <div class="card">
      <div class="cardTitle">Decision</div>
      ${d.version.status !== 'awaiting_approval'
        ? `<p class="fieldNote">This version is <b>${esc(d.version.status.replace(/_/g, ' '))}</b>, so there is nothing to approve right now.</p>
           <button class="ghost" data-edit="${esc(d.policy.id)}">Edit it</button>`
        : d.can_approve
          ? `<div class="qActions"><button id="doApprove">Approve and publish</button>
             <button class="ghost" id="doReject">Send back</button></div>`
          : `<p class="fieldNote">You can see this, but publishing it is the founders' call.</p>`}
    </div>`;
  wireAdminNav($('screen'));
  wireCopy($('screen'));
  $('screen').querySelectorAll('[data-edit]').forEach(b =>
    b.addEventListener('click', () => go({ view:'admin', admin:'edit', id: b.dataset.edit })));
  if ($('doApprove')) {
    $('doApprove').addEventListener('click', async (e) => {
      e.currentTarget.disabled = true;
      try {
        const r = await api({ action:'approve', version_id: id, approve: true });
        go({ view:'admin' });
        say(r.material ? 'Published. Everyone it reaches will see it as new.'
                       : 'Published as a minor change — nobody has to read it again.');
      } catch (err) { e.currentTarget.disabled = false; say(err.message, 'err'); }
    });
    $('doReject').addEventListener('click', async (e) => {
      e.currentTarget.disabled = true;
      try { await api({ action:'approve', version_id: id, approve: false }); go({ view:'admin' }); say('Sent back for another look.'); }
      catch (err) { e.currentTarget.disabled = false; say(err.message, 'err'); }
    });
  }
}

/* The house rules a standardiser follows when turning a Doc into a policy.
   Deliberately stored in the database rather than baked into a prompt or a
   memory note: they are Kim's to change without anyone deploying anything, and
   when the standardise-button automation lands it reads its instructions from
   this exact field. One source of truth, editable by the person who owns it. */
async function adminRules() {
  HOME = await api({ action: 'home' });
  const rules = HOME.settings?.standardising_rules || '';
  $('screen').innerHTML = `
    <div class="pageHead"><h2>House rules for standardising</h2>
      <p>The rules whoever turns a Google Doc into a policy has to follow — what they may change,
         what they must never change, and what they have to flag. Change these and the next
         standardisation follows the new version.</p></div>
    ${adminNav('rules')}
    <div class="card">
      <div class="cardTitle">The rules</div>
      <p class="fieldNote">Plain text, same formatting as a policy body: <code>##</code> for a heading,
        <code>-</code> for a bullet. These are instructions to a person or a machine, so be specific —
        "never invent a number" beats "be accurate".</p>
      <textarea id="fRules" rows="30" placeholder="Write the house rules here.">${esc(rules)}</textarea>
      <div class="qActions" style="margin-top:14px">
        <button id="saveRules">Save the rules</button>
        <button class="ghost" id="resetRules">Restore the version we started with</button>
      </div>
      <p class="fieldNote" style="margin-top:14px">Last saved rules are what gets applied. There is no
        version history on this page — if you are making a big change, copy the old text somewhere first.</p>
    </div>`;
  wireAdminNav($('screen'));
  $('saveRules').addEventListener('click', async (e) => {
    e.currentTarget.disabled = true;
    try {
      await api({ action:'save_settings', standardising_rules: $('fRules').value });
      HOME = await api({ action: 'home' });
      say('House rules saved.');
    } catch (err) { say(err.message, 'err'); }
    finally { e.currentTarget.disabled = false; }
  });
  $('resetRules').addEventListener('click', () => {
    if (!confirm('Replace what is in the box with the original rules? Nothing is saved until you click Save.')) return;
    $('fRules').value = DEFAULT_RULES;
    say('Restored in the box. Click Save the rules to keep it.');
  });
}

const DEFAULT_RULES = `## Who you are writing for

Write for the busiest, newest person who will ever need this. Most readers are on the floor, mid-service, on a phone.

If a sentence would sound odd said out loud during service, rewrite it.

Clear and direct, never corporate. British English.

## What you may change

- Headings, to match house style.
- Structure: lettered lists to bullets, long paragraphs split, duplicated content merged.
- Grammar, spelling and tense. US to British spelling.
- Formatting artefacts from the Doc.

## What you may NOT change

- Any rule, number, threshold, price or deadline.
- The meaning of an instruction, even if you think it is wrong. Flag it instead.
- Anything you would have to invent to fill. Never guess a value.

## Placeholders

Carry unresolved placeholders through exactly as written. Never invent a value to make a page look finished. List every one in the fidelity notes.

Leave merge fields alone.

## Fidelity notes

Every departure from the source gets a note. If it is not in the notes, it was not changed. That is the contract.`;

async function adminSettings() {
  const s = HOME.settings || {};
  $('screen').innerHTML = `
    <div class="pageHead"><h2>Settings</h2><p>Applies to the whole Handbook.</p></div>
    ${adminNav('settings')}
    <div class="card">
      <div class="grid2">
        <div>
          <label for="sWpm">Reading speed (words per minute)</label>
          <input id="sWpm" type="number" value="${esc(s.read_wpm ?? 200)}">
          <p class="fieldNote">Used to estimate how long a page takes.</p>
        </div>
        <div>
          <label for="sRace">Recently-published window (days)</label>
          <input id="sRace" type="number" value="${esc(s.race_window_days ?? 30)}">
        </div>
      </div>
      <label style="text-transform:none; letter-spacing:0; font-weight:400; font-size:12.5px; display:flex; gap:9px; align-items:center; margin-top:6px">
        <input type="checkbox" id="sArm" style="width:auto; margin:0"${s.scroll_arm !== false ? ' checked' : ''}>
        Make people scroll to the end before they can mark a page read
      </label>
      <label for="sCopy" style="margin-top:14px">All-caught-up message</label>
      <input id="sCopy" value="${esc(s.celebration_copy || '')}" placeholder="You are all caught up. Nice work.">
      <button id="saveSettings" style="margin-top:14px">Save settings</button>
    </div>`;
  wireAdminNav($('screen'));
  $('saveSettings').addEventListener('click', async (e) => {
    e.currentTarget.disabled = true;
    try {
      await api({ action:'save_settings', read_wpm:+$('sWpm').value, race_window_days:+$('sRace').value,
        scroll_arm: $('sArm').checked, celebration_copy: $('sCopy').value.trim() || null });
      HOME = await api({ action:'home' });
      say('Settings saved.');
    } catch (err) { say(err.message, 'err'); }
    finally { e.currentTarget.disabled = false; }
  });
}
