<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Handbook — Liquid &amp; Larder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gilda+Display&family=Inter:wght@400;500;600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="icon" href="/assets/favicon-light.svg" media="(prefers-color-scheme: light)">
<link rel="icon" href="/assets/favicon-dark.svg" media="(prefers-color-scheme: dark)">
<script>!function(){try{var p=localStorage.getItem("ll-theme")||"system",d=p==="dark"||p!=="light"&&matchMedia("(prefers-color-scheme: dark)").matches;var r=document.documentElement;r.setAttribute("data-theme",d?"dark":"light");r.setAttribute("data-theme-pref",p)}catch(e){document.documentElement.setAttribute("data-theme","light")}}();</script>
<link rel="stylesheet" href="/styles/core.css?v=5">
<link rel="stylesheet" href="/styles/hub.css?v=8">
<script defer src="/scripts/hub-motion.js?v=2"></script>
<style>
  :root {
    --page-w:1004px;

    /* ---- Round 1 reading tokens (3 Aug 2026) ----------------------------
       These two move into core.css in Round 3 so any future document-shaped
       app inherits them; they live here for now so this round stays one file.
       --font-reading is the ONLY place the reading face is named. */
    --font-reading:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    --ink-reading:var(--ink);
    --read-track:0em;

    /* Overwritten by [data-read-size] / [data-read-dens] below. These values
       are the defaults every reader starts on: Medium and Compact. */
    --read-fs:15.5px; --read-lh:1.68;
    --read-pgap:14px; --read-h2gap:34px; --read-h3gap:26px;
  }

  /* Body copy steps back from full linen in dark. At full strength a whole
     paragraph blooms and adjacent letterforms smear; a heading is short enough
     that it does not, so --accent-ink is deliberately untouched and the signed
     off palette is unchanged. The hair of tracking reopens the letter gaps that
     the lower contrast closes. */
  :root[data-theme="dark"] { --ink-reading:#d3d6c9; --read-track:.005em; }

  /* Reader preferences arrive as attributes on <html>, so both the reader and
     the admin version preview follow them without either knowing they exist. */
  :root[data-read-size="s"] { --read-fs:14.5px; }
  :root[data-read-size="m"] { --read-fs:15.5px; }
  :root[data-read-size="l"] { --read-fs:17px;   }
  :root[data-read-dens="comfortable"] { --read-pgap:19px; --read-h2gap:46px; --read-h3gap:34px; }
  :root[data-read-dens="compact"]     { --read-pgap:14px; --read-h2gap:34px; --read-h3gap:26px; }

  .hidden { display:none !important; }

  /* ---- shared bits ---- */
  .pageHead { margin-bottom:24px; }
  .pageHead h2 { font-family:'Gilda Display',serif; font-weight:400; font-size:29px; color:var(--accent-ink); margin-bottom:6px; }
  .pageHead p { color:var(--dim); font-size:12.5px; line-height:1.7; max-width:62ch; }
  .tabs { display:flex; gap:4px; flex-wrap:wrap; margin-bottom:22px; border-bottom:1px solid var(--hairline); }
  .tabs button { background:none; border:none; border-bottom:2px solid transparent; border-radius:0;
    padding:9px 14px; font-size:12.5px; font-weight:500; color:var(--dim); cursor:pointer; box-shadow:none; }
  .tabs button:hover { color:var(--ink); background:rgb(var(--tint-rgb) / .06); }
  .tabs button.on { color:var(--accent-ink); border-bottom-color:var(--accent-ink); }

  .chip { display:inline-flex; align-items:center; gap:6px; font-size:10px; font-weight:600;
    letter-spacing:.1em; text-transform:uppercase; padding:4px 11px; border-radius:999px; white-space:nowrap; }
  .chip::before { content:''; width:6px; height:6px; border-radius:50%; background:currentColor; }
  .chip.done    { background:rgb(var(--ok-rgb) / .12);   color:var(--ok); }
  .chip.todo    { background:rgb(var(--err-rgb) / .10);  color:var(--err); }
  .chip.waiting { background:rgb(var(--tint-rgb) / .10); color:var(--dim); }
  .chip.must    { background:rgb(var(--err-rgb) / .10);  color:var(--err); }
  .chip.plain   { background:rgb(var(--tint-rgb) / .07); color:var(--dim); }
  .chip.outside { background:rgb(var(--tint-rgb) / .07); color:var(--dim); }

  /* ---- progress ---- */
  .prog { display:flex; align-items:center; gap:14px; margin:4px 0 2px; }
  .progTrack { flex:1; height:8px; border-radius:999px; background:rgb(var(--tint-rgb) / .12); overflow:hidden; }
  .progFill { height:100%; border-radius:999px; background:var(--green); transition:width .5s ease; }
  .progNum { font-size:12px; color:var(--dim); white-space:nowrap; }

  /* ---- page lists ---- */
  .pageList { display:grid; gap:10px; }
  .pageRow { display:flex; align-items:flex-start; justify-content:space-between; gap:14px;
    padding:15px 17px; border:1px solid var(--hairline); border-radius:12px; background:var(--surface);
    cursor:pointer; transition:background .15s ease, box-shadow .15s ease; text-align:left; width:100%; }
  .pageRow:hover { background:rgb(var(--tint-rgb) / .06); box-shadow:0 4px 16px rgb(var(--green-rgb) / .08); }
  .pageRow:focus-visible { outline:none; box-shadow:var(--ring); }
  .pageRow .t { font-size:14px; color:var(--accent-ink); font-weight:500; margin-bottom:3px; }
  .pageRow .s { font-size:12px; color:var(--dim); line-height:1.6; }
  .pageRow .r { display:flex; flex-direction:column; align-items:flex-end; gap:6px; flex:none; }

  .catGrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px; }
  .catCard { padding:16px 18px; border:1px solid var(--hairline); border-radius:12px; background:var(--surface);
    cursor:pointer; text-align:left; width:100%; transition:background .15s ease; }
  .catCard:hover { background:rgb(var(--tint-rgb) / .06); }
  .catCard .n { font-family:'Gilda Display',serif; font-size:16px; color:var(--accent-ink); margin-bottom:6px; }
  .catCard .c { font-size:11px; color:var(--dim); }

  /* ---- the reading page ----
     ROUND 1 (3 Aug 2026) changed three things, all confined to this file:
     1. A READING FACE. Body copy comes off Montserrat, a geometric display sans
        drawn from shopfront signage: wide, near-circular, near-uniform stroke.
        Superb in a chip or a tab, tiring across eight hundred words, because
        adjacent letters share too much shape and the eye ends up resolving each
        word instead of recognising it. Inter is drawn for sustained screen
        reading and was chosen over Source Serif 4, Literata and IBM Plex Sans
        on the real no-show policy, in light and dark, at matched x-height.
        Montserrat keeps EVERY piece of interface chrome — chips, tabs, buttons,
        labels, docMeta — so the hub still sounds like itself. The face is named
        once, in --font-reading; do not hardcode it below.
     2. A FLUID MEASURE. A fixed 64ch left a thin strip of text beside a lot of
        empty page on a large monitor, which also made the scroll longer than it
        needed to be. The column now moves between 58ch and 72ch. Note that ch
        is measured from the font's own zero, so the rendered width shifts a
        little with the reading face. That is correct.
     3. READER CONTROLS. Three sizes, two densities, driven by the --read-*
        tokens at the top of this sheet.
     KEPT from the previous round, because both were right: asymmetric spacing
     (a heading sits far from the section above it and close to its own first
     line, so the eye groups by section) and headings with real weight. It was
     the letterforms underneath them that were doing the damage. */
  .doc { max-width:clamp(58ch, 62ch + 6vw, 72ch); padding-right:8px;
    font-family:var(--font-reading); }
  .doc h1 { font-family:'Gilda Display',serif; font-weight:400; font-size:33px; color:var(--accent-ink);
    margin-bottom:10px; line-height:1.2; text-wrap:balance; }
  .doc .lede { color:var(--dim); font-size:calc(var(--read-fs) - .5px); line-height:1.6;
    letter-spacing:var(--read-track); margin-bottom:6px; text-wrap:pretty; }
  /* docMeta is chrome, not prose — chips and a version stamp. Back to Montserrat. */
  .docMeta { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:16px 0 34px;
    padding-bottom:18px; border-bottom:1px solid var(--hairline); font-size:11px; color:var(--dim);
    font-family:'Montserrat',sans-serif; }
  .doc h2 { font-family:'Gilda Display',serif; font-weight:400; font-size:23px; color:var(--accent-ink);
    margin:var(--read-h2gap) 0 14px; line-height:1.3; text-wrap:balance; }
  .doc h2:first-child { margin-top:0; }
  .doc h3 { font-size:var(--read-fs); font-weight:600; letter-spacing:0; text-transform:none;
    color:var(--accent-ink); margin:var(--read-h3gap) 0 9px; line-height:1.4; text-wrap:balance; }
  .doc h3 + p, .doc h2 + p, .doc h3 + ul, .doc h2 + ul { margin-top:0; }
  .doc p  { font-size:var(--read-fs); line-height:var(--read-lh); color:var(--ink-reading);
    letter-spacing:var(--read-track); margin-bottom:var(--read-pgap); text-wrap:pretty; }
  .doc ul, .doc ol { margin:0 0 var(--read-pgap) 22px; }
  /* Bullets sit CLOSER to each other than paragraphs do to each other — a list
     is one thought, not several. The gap between items only needs to separate
     lines, not sections; the gap after the list does the section work. */
  .doc li { font-size:var(--read-fs); line-height:calc(var(--read-lh) - .04); color:var(--ink-reading);
    letter-spacing:var(--read-track); margin-bottom:4px; padding-left:3px; text-wrap:pretty; }
  .doc li:last-child { margin-bottom:0; }
  .doc li::marker { color:var(--dim); }
  .doc blockquote { margin:4px 0 22px; padding:4px 0 4px 18px; border-left:2px solid rgb(var(--tint-rgb) / .35);
    color:var(--dim); font-size:calc(var(--read-fs) - .5px); line-height:calc(var(--read-lh) - .02);
    letter-spacing:var(--read-track); font-style:italic; text-wrap:pretty; }
  .doc .callout { background:rgb(var(--tint-rgb) / .08); border:1px solid var(--hairline); border-radius:12px;
    padding:17px 20px; margin:2px 0 22px; font-size:calc(var(--read-fs) - 1px);
    line-height:calc(var(--read-lh) - .02); color:var(--ink-reading);
    letter-spacing:var(--read-track); text-wrap:pretty; }

  /* ---- the reader controls ----
     Deliberately quiet: a preference, not a feature. core.css gives every
     button a lift-and-brighten hover, which is wrong for a segmented control,
     so both are neutralised here. */
  .readBar { display:flex; align-items:center; gap:20px; flex-wrap:wrap; margin-bottom:24px;
    font-family:'Montserrat',sans-serif; }
  .readBar .g { display:flex; align-items:center; gap:9px; }
  .readBar .l { font-size:9.5px; font-weight:600; letter-spacing:.13em; text-transform:uppercase; color:var(--dim); }
  .readSeg { display:flex; gap:2px; background:rgb(var(--tint-rgb) / .07); padding:3px; border-radius:999px; }
  .readSeg button { background:none; border:none; box-shadow:none; border-radius:999px;
    font-family:'Montserrat',sans-serif; font-size:11px; font-weight:500; letter-spacing:0;
    text-transform:none; color:var(--dim); padding:5px 12px; cursor:pointer; transition:color .15s, background .15s; }
  .readSeg button:hover { color:var(--ink); transform:none; filter:none; }
  .readSeg button[aria-pressed="true"] { background:var(--card); color:var(--accent-ink); font-weight:600;
    box-shadow:0 1px 3px rgb(var(--green-rgb) / .12); }
  .readSeg button:focus-visible { outline:none; box-shadow:var(--ring); }
  .readTime { font-size:11px; color:var(--dim); margin-left:auto; white-space:nowrap; }

  /* ---- ROUND 4: blocks that have a shape (4 Aug 2026) ----
     Until now every policy had four tools: a heading, a paragraph, a bullet
     list and a grey box. So a procedure looked exactly like a paragraph of
     background, and a table of fees had to be written out as a sentence, which
     is where mistakes come from. These are the missing shapes.
     NOTE: the edge function stores `body` opaquely — there is no server-side
     whitelist of block types — so everything here is a pure client change.
     The flip side is that NOTHING upstream sanitises a block, so renderBody
     must keep escaping every single value it touches. Do not relax that. */

  /* Numbered steps. A procedure read while you are doing the thing needs the
     number findable at a glance, hence the hanging numeral rather than a
     browser list marker. */
  .doc .steps { list-style:none; margin:0 0 var(--read-pgap); padding:0; counter-reset:step; }
  .doc .steps li { counter-increment:step; position:relative; padding-left:38px;
    margin-bottom:calc(var(--read-pgap) * .8); }
  .doc .steps li:last-child { margin-bottom:0; }
  .doc .steps li::before { content:counter(step); position:absolute; left:0; top:-1px;
    width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:rgb(var(--tint-rgb) / .12); color:var(--accent-ink);
    font-family:'Montserrat',sans-serif; font-size:11px; font-weight:600; }

  /* Do / don't. Two columns on a wide screen, stacked on a narrow one — never
     side by side at a width that would squeeze either into two words a line. */
  .doc .dodont { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:0 0 var(--read-pgap); }
  @media (max-width:700px) { .doc .dodont { grid-template-columns:1fr; } }
  .doc .dodont > div { border:1px solid var(--hairline); border-radius:12px; padding:15px 17px; }
  .doc .dodont .do   { background:rgb(var(--ok-rgb) / .07); }
  .doc .dodont .dont { background:rgb(var(--err-rgb) / .06); }
  .doc .dodont .hd { font-family:'Montserrat',sans-serif; font-size:9.5px; font-weight:600;
    letter-spacing:.13em; text-transform:uppercase; margin-bottom:9px; }
  .doc .dodont .do .hd   { color:var(--ok); }
  .doc .dodont .dont .hd { color:var(--err); }
  .doc .dodont ul { margin:0 0 0 16px; }
  .doc .dodont li { font-size:calc(var(--read-fs) - 1px); margin-bottom:5px; }

  /* Definition rows. Term left, meaning right; stacked on narrow. */
  .doc .defs { margin:0 0 var(--read-pgap); border-top:1px solid var(--hairline); }
  .doc .defs .row { display:grid; grid-template-columns:minmax(120px,.32fr) 1fr; gap:16px;
    padding:12px 2px; border-bottom:1px solid var(--hairline); }
  @media (max-width:700px) { .doc .defs .row { grid-template-columns:1fr; gap:4px; } }
  .doc .defs .term { font-weight:600; color:var(--accent-ink); font-size:calc(var(--read-fs) - .5px);
    line-height:1.5; }
  .doc .defs .def { color:var(--ink-reading); font-size:calc(var(--read-fs) - .5px);
    line-height:calc(var(--read-lh) - .06); letter-spacing:var(--read-track); }

  /* Tables. Amounts, timings, thresholds. Scrolls sideways rather than
     crushing columns, because a squeezed number column is a misread number. */
  .doc .tableWrap { margin:0 0 var(--read-pgap); overflow-x:auto; border:1px solid var(--hairline);
    border-radius:12px; }
  .doc table { border-collapse:collapse; width:100%; font-size:calc(var(--read-fs) - 1.5px); }
  .doc th, .doc td { text-align:left; padding:10px 14px; border-bottom:1px solid var(--hairline);
    line-height:1.5; letter-spacing:var(--read-track); }
  .doc th { font-family:'Montserrat',sans-serif; font-size:9.5px; font-weight:600; letter-spacing:.1em;
    text-transform:uppercase; color:var(--dim); background:rgb(var(--tint-rgb) / .05); white-space:nowrap; }
  .doc td { color:var(--ink-reading); }
  .doc tr:last-child td { border-bottom:none; }

  /* Collapsible detail — full scripts, appendices, the long tail. Closed by
     default so it stops padding out the page, and forced OPEN for printing,
     because a printed policy with hidden sections is a policy with holes. */
  .doc details { border:1px solid var(--hairline); border-radius:12px; margin:0 0 var(--read-pgap);
    background:rgb(var(--tint-rgb) / .04); }
  .doc summary { cursor:pointer; padding:13px 17px; font-family:'Montserrat',sans-serif;
    font-size:11.5px; font-weight:600; letter-spacing:.04em; color:var(--accent-ink);
    list-style:none; display:flex; align-items:center; gap:9px; }
  .doc summary::-webkit-details-marker { display:none; }
  .doc summary::before { content:'▸'; font-size:10px; transition:transform .15s ease; color:var(--dim); }
  .doc details[open] > summary::before { transform:rotate(90deg); }
  .doc summary:focus-visible { outline:none; box-shadow:var(--ring); border-radius:12px; }
  .doc .detailsBody { padding:2px 17px 15px; }
  .doc .detailsBody > *:last-child { margin-bottom:0; }

  /* A job description rendered live from hub_hats. Never a stored copy —
     see the note on renderBody. */
  .doc .jd { border:1px solid var(--hairline); border-radius:12px; padding:4px 18px 16px;
    margin:0 0 var(--read-pgap); background:rgb(var(--tint-rgb) / .04); }
  .doc .jd .src { font-family:'Montserrat',sans-serif; font-size:9.5px; font-weight:600;
    letter-spacing:.13em; text-transform:uppercase; color:var(--dim); margin:14px 0 10px; }
  .doc .jd h4 { font-family:'Montserrat',sans-serif; font-size:11px; font-weight:600;
    letter-spacing:.09em; text-transform:uppercase; color:var(--accent-ink); margin:16px 0 7px; }
  .doc .jd p { margin-bottom:0; white-space:pre-wrap; }
  .doc .jd .missing { color:var(--dim); font-style:italic; }

  /* ---- at a glance ----
     Three of its four parts cost nothing: reading time is already computed,
     the audience is already in the database, and "what changed" is a field on
     every version that nothing was reading. Only the key points need writing,
     and the card degrades cleanly when they are absent. */
  .glance { border:1px solid var(--hairline); border-radius:14px; background:rgb(var(--tint-rgb) / .05);
    padding:18px 20px; margin:0 0 30px; font-family:'Montserrat',sans-serif; }
  .glance .hd { font-size:9.5px; font-weight:600; letter-spacing:.14em; text-transform:uppercase;
    color:var(--dim); margin-bottom:13px; }
  .glance .facts { display:flex; flex-wrap:wrap; gap:8px 22px; margin-bottom:2px; }
  .glance .fact { font-size:11.5px; color:var(--dim); line-height:1.6; }
  .glance .fact b { color:var(--accent-ink); font-weight:600; }
  .glance ul { list-style:none; margin:14px 0 0; padding:0; }
  .glance li { position:relative; padding-left:19px; margin-bottom:7px;
    font-family:var(--font-reading); font-size:calc(var(--read-fs) - 1px);
    line-height:calc(var(--read-lh) - .06); color:var(--ink-reading); letter-spacing:var(--read-track); }
  .glance li:last-child { margin-bottom:0; }
  .glance li::before { content:''; position:absolute; left:4px; top:.62em; width:5px; height:5px;
    border-radius:50%; background:var(--accent-ink); opacity:.55; }
  .glance .changed { margin-top:13px; padding-top:12px; border-top:1px solid var(--hairline);
    font-size:11.5px; color:var(--dim); line-height:1.65; }
  .glance .changed b { color:var(--accent-ink); font-weight:600; }

  @media print {
    .doc details { border:none; background:none; }
    .doc details > summary { padding-left:0; font-size:12pt; }
    .glance { break-inside:avoid; }
  }

  /* ---- ROUND 2: position and structure (3 Aug 2026) ----
     "Hard to scroll through" was never really about scrolling. It was about not
     knowing where you are, how much is left, or how to get back to something you
     passed. Four moving parts answer that, and they all read the same scroll
     position, so they share ONE listener and ONE requestAnimationFrame — four
     separate listeners would each force their own layout read every frame. */

  /* The progress line sits ABOVE the topbar, which owns z-index 40. */
  .readProg { position:fixed; top:0; left:0; height:2px; width:0; z-index:60;
    background:var(--accent-ink); opacity:.9; transition:width .08s linear; pointer-events:none; }

  /* The slim header slides out from UNDER the topbar — z-index 35 against the
     topbar's 40 — once the policy's own h1 has scrolled away. Before this, the
     only way to mark a policy read was to be physically at the bottom of it,
     which is absurd for someone reopening a policy to check one line. */
  .stickyHead { position:fixed; left:0; right:0; z-index:35; top:var(--topbar-h,68px);
    background:rgb(var(--bg-rgb) / .93); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    border-bottom:1px solid var(--hairline);
    transform:translateY(-102%); opacity:0; transition:transform .22s ease, opacity .22s ease; }
  .stickyHead.on { transform:none; opacity:1; }
  .stickyHead .in { max-width:var(--page-w,1004px); margin:0 auto; padding:9px 22px;
    display:flex; align-items:center; gap:12px; }
  .stickyHead .t { font-family:'Gilda Display',serif; font-size:16px; color:var(--accent-ink);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
  .stickyHead .sp { margin-left:auto; display:flex; align-items:center; gap:9px; flex:none; }
  .stickyHead button { padding:8px 18px; font-size:10px; }

  /* ---- the layout. .wrap is 1004px and the document renders 629-641px, so
         there is roughly 340px of margin doing nothing. That is where the rail
         goes. Below 1100px there is no room, so it folds into one button. ---- */
  .readLayout { display:grid; grid-template-columns:minmax(0,1fr); }
  .rail { order:-1; margin-bottom:22px; font-family:'Montserrat',sans-serif; }
  .railToggle { background:var(--sand-soft); color:var(--accent-ink); box-shadow:none;
    padding:8px 16px; font-size:10px; }
  .railHd { font-size:9px; font-weight:600; letter-spacing:.14em; text-transform:uppercase;
    color:var(--dim); margin-bottom:8px; display:none; }
  .railList { display:none; list-style:none; margin:12px 0 0; padding:0;
    border-left:1px solid var(--hairline); }
  .railList.open { display:block; }
  .railList a { display:block; text-decoration:none; color:var(--dim); font-size:11.5px;
    line-height:1.45; padding:6px 0 6px 14px; margin-left:-1px; border-left:2px solid transparent;
    transition:color .15s ease, border-color .15s ease; }
  .railList a:hover { color:var(--ink); }
  .railList a.on { color:var(--accent-ink); border-left-color:var(--accent-ink); font-weight:600; }
  /* NOT .sub — hub.css already owns that class for the topbar's "HUB · HANDBOOK"
     line and would render every h3 in the rail as letterspaced capitals. */
  .railList a.lv2 { padding-left:27px; font-size:11px; }
  .railList a:focus-visible { outline:none; box-shadow:var(--ring); border-radius:4px; }
  @media (min-width:1100px) {
    .readLayout { grid-template-columns:minmax(0,1fr) 208px; gap:36px; align-items:start; }
    /* Clears BOTH fixed bars: the topbar, and the sticky header that appears

       the rail never ends up underneath it. */
    .rail { order:0; margin-bottom:0; position:sticky; top:calc(var(--topbar-h,68px) + 62px);

  /* ---- heading anchors, so a manager can send someone one clause rather than

  .resume { display:flex; align-items:center; gap:12px; flex-wrap:wrap;

  .resume button { padding:7px 15px; font-size:10px; }

  /* #llToastZone owns the bottom-right corner at z-index 200, so this sits above it. */

  /* A copyable template — the guest email, a script, anything meant to be

  .doc .tmpl pre { white-space:pre-wrap; word-break:break-word; margin:0; font-family:var(--font-reading);

  .tmplBar { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:10px; }
  .tmplBar .l { font-size:10px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--dim); }
  /* Inside an admin card the text sat hard against the left edge. A small

  .card > .doc { padding-left:6px; }
  .doc figure { margin:0 0 18px; }
  .doc figure img { max-width:100%; border-radius:12px; display:block; }
  .doc figcaption { font-size:11px; color:var(--dim); margin-top:7px; }

  .endCard { margin-top:34px; padding:20px 22px; border:1px solid var(--hairline); border-radius:14px; background:var(--surface); }
  .endCard .h { font-family:'Gilda Display',serif; font-size:18px; color:var(--accent-ink); margin-bottom:6px; }
  .endCard .b { font-size:12.5px; color:var(--dim); line-height:1.7; margin-bottom:14px; }
  .relRow { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:10px; margin-top:22px; }

  /* ---- forms / admin ---- */

  .fieldNote { font-size:11px; color:var(--dim); margin:-6px 0 12px; line-height:1.6; }

  /* hub.css v8 styles `input, select` but NOT `textarea`, so an unstyled one
     renders as a ~180px monospace box that is unusable for writing a policy in.

  textarea { width:100%; padding:11px 13px; background:var(--surface); color:var(--ink);

  .pickBox { max-height:240px; overflow-y:auto; border:1px solid var(--hairline); border-radius:10px; padding:10px 12px; margin-bottom:6px; }

  .reach { border:1px solid var(--hairline); border-radius:12px; padding:15px 17px; background:rgb(var(--tint-rgb) / .05); }
  .reach .big { font-size:22px; font-family:'Gilda Display',serif; color:var(--accent-ink); }
  .reach ul { margin:10px 0 0 18px; }

  .qRow { display:flex; gap:9px; align-items:center; margin-bottom:8px; }
  .qRow input { margin:0; }
  .qRow button { flex:none; }

  .stack { display:grid; gap:10px; }
  .qCard { border:1px solid var(--hairline); border-radius:12px; padding:15px 17px; background:var(--surface); }
  .qCard .top { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:8px; }
  .qCard .t { font-size:13.5px; color:var(--accent-ink); font-weight:500; }
  .qCard .m { font-size:11px; color:var(--dim); margin-top:3px; }

  .empty { text-align:center; padding:40px 20px; color:var(--dim); font-size:13px; line-height:1.7; }

  /* ---- print: the page only, nothing else ---- */
  @media print {
    .topbar, .tabs, .endCard, .relRow, #pageMsg, .readBar,

    .doc { max-width:none; }

    .doc figure, .doc .callout, .doc blockquote { break-inside:avoid; }
    .printFoot { display:block !important; margin-top:24pt; padding-top:8pt;
      border-top:1px solid #999; font-size:8pt; color:#444; }
  }
  .printFoot { display:none; }
</style>

<body>
<header class="topbar">
  <div class="bar">
    <div>
      <h1 class="logo" aria-label="Liquid &amp; Larder"></h1>

    </div>
    <button class="ghost" id="refresh">Refresh</button>
  </div>
</header>

<div class="wrap">
  <div class="msg" id="pageMsg"></div>
  <div class="tabs noprint" id="tabs"></div>
  <div id="screen"><div class="empty">Loading…</div></div>
</div>

<script>
const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const SUPABASE_URL = 'https://lkoqyllmtoodthrtjgfm.supabase.co';
const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxrb3F5bGxtdG9vZHRocnRqZ2ZtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM0MjI4MDAsImV4cCI6MjA5ODk5ODgwMH0.xdPjk-z2HvvLc-mw9b3buZ9Hj1I1ykXFy6cFtRr1isg';
const FN = SUPABASE_URL + '/functions/v1/handbook-staff';

const sb = supabase.createClient(SUPABASE_URL, ANON_KEY);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const msg = $('pageMsg');

/* ================= reader preferences =================
   Text size and line spacing live in localStorage beside "ll-theme", not on the
   profile. They are a per-device comfort setting — the same person wants
   something different on a 13-inch laptop and a 27-inch desk monitor — and
   keeping them local costs no round trip and no schema change. If we ever want
   them to follow a person between machines, move them onto portal_profiles and
   read them out of the home payload; nothing else here has to change.
   Defaults are Medium and Compact.
   The attributes go on <html>, not on the article, so the admin version preview
   picks them up too without knowing they exist. */
const READ_DEFAULTS = { size:'m', dens:'compact' };
function readPrefs() {
  try {
    return { size: localStorage.getItem('ll-read-size') || READ_DEFAULTS.size,
             dens: localStorage.getItem('ll-read-dens') || READ_DEFAULTS.dens };
  } catch (e) { return { ...READ_DEFAULTS }; }   // private mode, blocked storage
}
function applyReadPrefs(p) {
  const r = document.documentElement;
  r.setAttribute('data-read-size', p.size);
  r.setAttribute('data-read-dens', p.dens);
  try {
    localStorage.setItem('ll-read-size', p.size);
    localStorage.setItem('ll-read-dens', p.dens);
  } catch (e) {}
}
applyReadPrefs(readPrefs());

/* Reading time, from the word count of the blocks at the words-per-minute set
   in Admin. Rounded up and floored at one, so nothing ever reads "0 min".

   It walks the block VALUES rather than a list of known keys, because the
   Round 4 types carry their text in half a dozen different shapes — table rows
   are arrays of arrays, definitions are {term, def} objects, do/don't has two
   lists, and a collapsible holds whole blocks of its own. Counting only
   `text` and `items`, as the first version did, made a page of tables and
   procedures report "1 min read" when it was nothing of the sort. */
function countWords(v, depth) {
  const d = depth || 0;
  if (v == null || d > 6) return 0;
  if (typeof v === 'string') return v.trim().split(/\s+/).filter(Boolean).length;
  if (Array.isArray(v)) return v.reduce((n, x) => n + countWords(x, d + 1), 0);
  if (typeof v === 'object') {
    let n = 0;
    for (const [k, val] of Object.entries(v)) {
      if (k === 'type' || k === 'hat_id') continue;   // machinery, not prose
      n += countWords(val, d + 1);
    }
    return n;
  }
  return 0;
}
function readMinutes(body) {
  const blocks = Array.isArray(body?.blocks) ? body.blocks : [];
  const wpm = Number(HOME?.settings?.read_wpm) || 200;
  return Math.max(1, Math.ceil(countWords(blocks) / wpm));
}

function readBar(minutes) {
  const p = readPrefs();
  const seg = (key, opts) => `<span class="readSeg" data-key="${key}">` + opts.map(o =>
    `<button type="button" data-v="${o.v}" aria-pressed="${p[key] === o.v}" aria-label="${esc(o.a)}">${esc(o.l)}</button>`
  ).join('') + '</span>';
  return `<div class="readBar noprint">
    <span class="g"><span class="l">Text</span>${seg('size', [
      { v:'s', l:'S', a:'Small text' }, { v:'m', l:'M', a:'Medium text' }, { v:'l', l:'L', a:'Large text' }])}</span>
    <span class="g"><span class="l">Spacing</span>${seg('dens', [
      { v:'comfortable', l:'Comfortable', a:'Comfortable spacing' },
      { v:'compact',     l:'Compact',     a:'Compact spacing' }])}</span>
    ${minutes ? `<span class="readTime">${minutes} min read</span>` : ''}
  </div>`;
}
function wireReadBar(root) {
  root.querySelectorAll('.readSeg').forEach(seg => {
    seg.querySelectorAll('button').forEach(btn => btn.addEventListener('click', () => {
      const p = readPrefs();
      p[seg.dataset.key] = btn.dataset.v;
      applyReadPrefs(p);
      seg.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === btn));
    }));
  });
}

/* ================= reader position and structure =================
   Everything below is Round 2. It is all presentation: not one line of it can
   decide whether a must-know policy has been read. The server still sets
   arm_on_scroll, and the arming test below is the same comparison it always
   was — the progress bar just means the reader can see how far off they are
   instead of being told to scroll and left to guess. */

/* The topbar is sticky and its height changes with the viewport, so the two
   fixed bars and every scroll-margin measure off a live value. */
function topbarH() {
  const t = document.querySelector('.topbar');
  const h = t ? Math.round(t.getBoundingClientRect().height) : 68;
  document.documentElement.style.setProperty('--topbar-h', h + 'px');
  return h;
}
topbarH();
addEventListener('resize', topbarH);

const smoothly = () => matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth';

/* "6. Refunds" becomes #refunds, so a link survives the section being
   renumbered. Duplicate headings get a numeric suffix. */
function slugify(text, used) {
  const base = String(text).toLowerCase()
    .replace(/^\d+[.)]\s*/, '')
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-+|-+$/g, '') || 'section';
  let id = base, n = 2;
  while (used.has(id)) id = base + '-' + (n++);
  used.add(id);
  return id;
}

/* Ids and the hover anchor are added AFTER render rather than inside
   renderBody, so the admin version preview is untouched by any of this. */
function anchorHeadings(doc) {
  const used = new Set();
  return [...doc.querySelectorAll('h2, h3')].map(el => {
    const text = el.textContent.trim();
    const id = slugify(text, used);
    el.id = id;
    const a = document.createElement('a');
    a.className = 'anchor'; a.href = '#' + id; a.textContent = '#';
    a.setAttribute('aria-label', 'Link to this section');
    el.appendChild(a);
    return { id, el, text, sub: el.tagName === 'H3' };
  });
}

function railHtml(heads) {
  if (heads.length < 2) return '';
  return `<aside class="rail noprint" id="rail">
    <div class="railHd">On this page</div>
    <button class="railToggle" type="button" id="railToggle" aria-expanded="false">Jump to&hellip;</button>
    <ul class="railList" id="railList">${heads.map(h =>
      `<li><a href="#${esc(h.id)}" data-jump="${esc(h.id)}" class="${h.sub ? 'lv2' : ''}">${esc(h.text)}</a></li>`
    ).join('')}</ul>
  </aside>`;
}

const POS_KEY = slug => 'll-hb-pos:' + slug;
function savedPos(slug) {
  try { return Number(localStorage.getItem(POS_KEY(slug))) || 0; } catch (e) { return 0; }
}
function clearPos(slug) { try { localStorage.removeItem(POS_KEY(slug)); } catch (e) {} }


function say(text, kind) {
  msg.className = 'msg ' + (kind || 'ok');
  msg.textContent = text;
}
function clearSay() { msg.className = 'msg'; msg.textContent = ''; }

/* ---- URL state. Query params only, so a page is linkable and Back works. ---- */
function readUrl() {
  const q = new URLSearchParams(location.search);
  return { view: q.get('view') || 'home', p: q.get('p') || '', cat: q.get('cat') || '',
           admin: q.get('admin') || '', id: q.get('id') || '' };
}
function go(state, replace) {
  const q = new URLSearchParams();
  for (const [k, v] of Object.entries(state)) if (v) q.set(k, v);
  const url = location.pathname + (q.toString() ? '?' + q : '');
  history[replace ? 'replaceState' : 'pushState']({}, '', url);
  render();
}
addEventListener('popstate', render);

let HOME = null;      // home payload, cached across screens
let META = null;      // admin lookups
let DRAFT = null;     // policy being edited

async function api(payload) {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { location.href = '/'; throw new Error('Signed out'); }
  const res = await fetch(FN, {
    method: 'POST',
    headers: { 'Content-Type':'application/json', 'apikey': ANON_KEY, 'Authorization': 'Bearer ' + session.access_token },
    body: JSON.stringify(payload),
  });
  const data = await res.json();
  if (!res.ok || data.error) throw new Error(data.error || 'Request failed');
  return data;
}

(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { location.href = '/'; return; }
  try {
    HOME = await api({ action: 'home' });
    render();
  } catch (e) { say(e.message, 'err'); $('screen').innerHTML = ''; }
})();

$('refresh').addEventListener('click', () => location.reload());

/* ================= chrome ================= */

function drawTabs() {
  const s = readUrl();
  const t = [
    { k:'home',   label:'My handbook' },
    { k:'browse', label:'Browse' },
  ];
  if (HOME?.can?.check_off) t.push({ k:'team', label:'My team' });
  if (HOME?.can?.submit)    t.push({ k:'admin', label:'Admin' });
  $('tabs').innerHTML = t.map(x =>
    `<button class="${s.view === x.k ? 'on' : ''}" data-go="${x.k}">${esc(x.label)}</button>`).join('');
  $('tabs').querySelectorAll('[data-go]').forEach(b =>
    b.addEventListener('click', () => go({ view: b.dataset.go })));
}

const stateChip = st => ({
  todo:               '<span class="chip todo">To read</span>',
  read:               '<span class="chip done">Read</span>',
  checked:            '<span class="chip done">Checked off</span>',
  waiting_on_a_check: '<span class="chip waiting">Waiting on a check</span>',
}[st] || '');

function pageRow(p) {
  return `<button class="pageRow" data-slug="${esc(p.slug)}">
    <span>
      <span class="t">${esc(p.title)}</span>
      ${p.summary ? `<span class="s">${esc(p.summary)}</span>` : ''}
    </span>
    <span class="r">
      ${stateChip(p.state)}
      ${p.tier === 'must_know' ? '<span class="chip must">Must know</span>' : ''}
      ${p.outside_your_hats ? '<span class="chip outside">Outside your hats</span>' : ''}
    </span>
  </button>`;
}
function wireRows(root) {
  root.querySelectorAll('[data-slug]').forEach(b =>
    b.addEventListener('click', () => go({ view:'page', p: b.dataset.slug })));
  wireCopy(root);
}

/* Copy-to-clipboard for template blocks. Falls back to selecting the text if
   the clipboard API is unavailable, so the button is never a dead end. */
function wireCopy(root) {
  root.querySelectorAll('[data-copy]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const pre = btn.closest('.tmpl').querySelector('pre');
      const text = pre.innerText;
      const done = () => {
        const was = btn.textContent;
        btn.textContent = 'Copied';
        setTimeout(() => { btn.textContent = was; }, 1600);
      };
      try {
        await navigator.clipboard.writeText(text);
        done();
      } catch (e) {
        const r = document.createRange();
        r.selectNodeContents(pre);
        const sel = getSelection();
        sel.removeAllRanges();
        sel.addRange(r);
        btn.textContent = 'Press ' + (navigator.platform.includes('Mac') ? '⌘C' : 'Ctrl+C');
        setTimeout(() => { btn.textContent = 'Copy'; }, 2600);
      }
    });
  });
}

/* The reader adds window-level listeners. render() blows away #screen, which
   takes the reader's own DOM with it, but the listeners would survive and keep
   measuring elements that no longer exist — so every screen change tears the
   previous reader down first. */
let readerTeardown = null;

function render() {
  clearSay();
  if (readerTeardown) { readerTeardown(); readerTeardown = null; }
  drawTabs();
  const s = readUrl();
  if (s.view === 'page')   return screenPage(s.p);
  if (s.view === 'browse') return screenBrowse(s.cat);
  if (s.view === 'team')   return screenTeam();
  if (s.view === 'admin')  return screenAdmin(s.admin, s.id);
  return screenHome();
}

/* ================= reader ================= */

async function screenHome() {
  const d = HOME = await api({ action: 'home' });
  const mine = d.pages.filter(p => !p.outside_your_hats);
  const todo = mine.filter(p => p.state === 'todo' || p.state === 'waiting_on_a_check');
  const done = mine.filter(p => p.state === 'read' || p.state === 'checked');
  const pct = d.progress.total ? Math.round(d.progress.done / d.progress.total * 100) : 0;

  $('screen').innerHTML = `
    <div class="pageHead">
      <h2>Your handbook</h2>
      <p>Everything here is aimed at the hats you wear. Read a page and it is marked off;
         a <b>must know</b> page also needs a quick check by whoever you report to.</p>
    </div>

    <div class="card">
      <div class="cardTitle">Where you are up to</div>
      <div class="prog">
        <div class="progTrack"><div class="progFill" style="width:${pct}%"></div></div>
        <div class="progNum">${d.progress.done} of ${d.progress.total}</div>
      </div>
      ${d.progress.caught_up
        ? `<p class="fieldNote" style="margin-top:12px">${esc(d.settings?.celebration_copy || 'You are all caught up. Nice work.')}</p>`
        : `<p class="fieldNote" style="margin-top:12px">${todo.length} still to go.</p>`}
    </div>

    ${todo.length ? `<div class="card">
      <div class="cardTitle">To read</div>
      <div class="pageList" id="todoList">${todo.map(pageRow).join('')}</div>
    </div>` : ''}

    ${done.length ? `<div class="card">
      <div class="cardTitle">Done</div>
      <div class="pageList" id="doneList">${done.map(pageRow).join('')}</div>
    </div>` : ''}

    ${!mine.length ? `<div class="card"><div class="empty">
      Nothing is aimed at your hats yet. When a page is published for you it will appear here.
    </div></div>` : ''}`;
  wireRows($('screen'));
}

async function screenBrowse(catId) {
  const d = await api({ action: 'browse' });
  const byCat = new Map();
  for (const p of d.pages) {
    const k = p.category_id || 'uncategorised';
    byCat.set(k, [...(byCat.get(k) || []), p]);
  }
  if (!catId) {
    const cats = d.categories.filter(c => (byCat.get(c.id) || []).length);
    $('screen').innerHTML = `
      <div class="pageHead">
        <h2>Browse</h2>
        <p>Every page you can open, by category. Pages aimed at other hats are not listed.</p>
      </div>
      ${cats.length ? `<div class="catGrid">${cats.map(c => {
        const n = (byCat.get(c.id) || []).length;
        const cc = d.counts[c.id];
        return `<button class="catCard" data-cat="${esc(c.id)}">
          <span class="n">${esc(c.name)}</span>
          <span class="c">${n} page${n === 1 ? '' : 's'}${cc ? ` · ${cc.done}/${cc.total} done` : ''}</span>
        </button>`;
      }).join('')}</div>` : '<div class="card"><div class="empty">No pages published yet.</div></div>'}`;
    $('screen').querySelectorAll('[data-cat]').forEach(b =>
      b.addEventListener('click', () => go({ view:'browse', cat: b.dataset.cat })));
    return;
  }
  const cat = d.categories.find(c => c.id === catId);
  const list = byCat.get(catId) || [];
  $('screen').innerHTML = `
    <div class="pageHead">
      <h2>${esc(cat?.name || 'Category')}</h2>
      <p><a href="?view=browse" class="back">&larr; All categories</a></p>
    </div>
    <div class="card"><div class="pageList">${list.map(pageRow).join('') || '<div class="empty">Nothing here.</div>'}</div></div>`;
  wireRows($('screen'));
}

/* Body is stored as blocks, never as HTML — nothing authored can inject markup.
   This matters more than it looks: handbook-staff stores `body` completely
   opaquely. There is no server-side whitelist of block types and no
   sanitising, so THIS FUNCTION IS THE ONLY THING standing between authored
   content and the DOM. Every value that reaches the page goes through esc().
   An unknown block type renders as nothing rather than guessing.

   `jd` is the map of hat_id -> job description supplied by the page action.
   It is passed in rather than baked into the block because a job description
   must never be a stored copy: hub_hats is the source of truth, so the block
   holds only a hat id and the content is resolved fresh on every read.
   `depth` guards the one recursive block type (details) against a body that
   nests into itself. */
function renderBody(body, assets, jd, depth) {
  const blocks = Array.isArray(body?.blocks) ? body.blocks : [];
  const d = depth || 0;
  const out = blocks.map(b => {
    const text = esc(b.text || '');
    const items = Array.isArray(b.items) ? b.items : [];
    if (b.type === 'h2')      return `<h2>${text}</h2>`;
    if (b.type === 'h3')      return `<h3>${text}</h3>`;
    if (b.type === 'ul')      return `<ul>${items.map(i => `<li>${esc(i)}</li>`).join('')}</ul>`;
    if (b.type === 'ol')      return `<ol>${items.map(i => `<li>${esc(i)}</li>`).join('')}</ol>`;
    if (b.type === 'callout') return `<div class="callout">${text}</div>`;
    if (b.type === 'quote')   return `<blockquote>${text}</blockquote>`;
    if (b.type === 'copy')    return `<div class="tmpl">
      <div class="tmplBar">
        <span class="l">${esc(b.label || 'Template')}</span>
        <button class="ghost noprint" data-copy type="button">Copy</button>
      </div><pre>${text}</pre></div>`;

    /* ---- Round 4 ---- */
    if (b.type === 'steps')
      return `<ol class="steps">${items.map(i => `<li>${esc(i)}</li>`).join('')}</ol>`;

    if (b.type === 'dodont') {
      const col = (cls, hd, list) => `<div class="${cls}">
        <div class="hd">${esc(hd)}</div>
        <ul>${(Array.isArray(list) ? list : []).map(i => `<li>${esc(i)}</li>`).join('')}</ul>
      </div>`;
      return `<div class="dodont">
        ${col('do', b.do_label || 'Do', b.do)}
        ${col('dont', b.dont_label || 'Don’t', b.dont)}
      </div>`;
    }

    if (b.type === 'defs')
      return `<div class="defs">${items.map(i => `<div class="row">
        <div class="term">${esc(i?.term || '')}</div>
        <div class="def">${esc(i?.def || '')}</div>
      </div>`).join('')}</div>`;

    if (b.type === 'table') {
      const head = Array.isArray(b.head) ? b.head : [];
      const rows = Array.isArray(b.rows) ? b.rows : [];
      /* Ragged rows are normalised to the header width rather than rejected —
         a half-filled table should still render, not blank the page. */
      const w = Math.max(head.length, ...rows.map(r => (Array.isArray(r) ? r.length : 0)), 1);
      const cells = (r, tag) => Array.from({ length: w },
        (_, i) => `<${tag}>${esc((Array.isArray(r) ? r[i] : '') ?? '')}</${tag}>`).join('');
      return `<div class="tableWrap"><table>
        ${head.length ? `<thead><tr>${cells(head, 'th')}</tr></thead>` : ''}
        <tbody>${rows.map(r => `<tr>${cells(r, 'td')}</tr>`).join('')}</tbody>
      </table></div>`;
    }

    if (b.type === 'details') {
      if (d >= 3) return '';   // nested too deep; drop rather than recurse forever
      const inner = renderBody({ blocks: Array.isArray(b.blocks) ? b.blocks : [] }, [], jd, d + 1);
      return `<details><summary>${esc(b.label || 'More detail')}</summary>
        <div class="detailsBody">${inner}</div></details>`;
    }

    if (b.type === 'hat_jd') {
      const h = jd && jd[b.hat_id];
      if (!h) return `<div class="jd"><p class="src missing">This job description could not be loaded.</p></div>`;
      const part = (label, val) => val && String(val).trim()
        ? `<h4>${esc(label)}</h4><p>${esc(val)}</p>` : '';
      const body = part('Key responsibilities', h.key_responsibilities)
                 + part('Accountable for', h.accountable_for)
                 + part('Success metrics', h.success_metrics);
      return `<div class="jd">
        <div class="src">Live from the team directory${h.department ? ' · ' + esc(h.department) : ''}</div>
        ${body || '<p class="missing">Nothing has been filled in against this hat yet.</p>'}
      </div>`;
    }

    if (b.type === 'p' || !b.type) return `<p>${text}</p>`;
    return '';   // unknown type: render nothing rather than guess
  }).join('');
  const figs = (assets || []).map(a =>
    `<figure><img src="${esc(a.url)}" alt="${esc(a.alt || '')}" loading="lazy"${
      a.width && a.height ? ` width="${esc(a.width)}" height="${esc(a.height)}"` : ''}>${
      a.alt ? `<figcaption>${esc(a.alt)}</figcaption>` : ''}</figure>`).join('');
  return out + figs;
}

/* ---- at a glance ----
   Reading time we already compute. The audience and the changelog are both
   already in the database and were simply never surfaced. Only the key points
   are authored, and every part is optional — with none of them the card does
   not render at all, so nothing existing sprouts an empty box. */
function glanceCard(p, minutes) {
  const keys = Array.isArray(p.body?.key_points)
    ? p.body.key_points.map(k => String(k).trim()).filter(Boolean) : [];
  const audience = Array.isArray(p.audience) ? p.audience.filter(Boolean) : [];
  const changed = p.tier === 'must_know' || p.changelog ? (p.changelog || '').trim() : '';
  if (!keys.length && !audience.length && !changed) return '';

  const list = (arr) => arr.length > 3
    ? esc(arr.slice(0, 3).join(', ')) + ` and ${arr.length - 3} more`
    : esc(arr.join(', '));

  return `<div class="glance">
    <div class="hd">At a glance</div>
    <div class="facts">
      <span class="fact"><b>${minutes} min</b> read</span>
      ${audience.length ? `<span class="fact">Applies to <b>${list(audience)}</b></span>` : ''}
      ${p.version_no ? `<span class="fact">Version <b>${esc(p.version_no)}</b></span>` : ''}
    </div>
    ${keys.length ? `<ul>${keys.map(k => `<li>${esc(k)}</li>`).join('')}</ul>` : ''}
    ${changed ? `<div class="changed"><b>What changed:</b> ${esc(changed)}</div>` : ''}
  </div>`;
}

async function screenPage(slug) {
  let d;
  try { d = await api({ action:'page', slug }); }
  catch (e) {
    $('screen').innerHTML = `<div class="card"><div class="empty">
      That page is not available to you.<br><a href="?view=home" class="back">Back to your handbook</a></div></div>`;
    return;
  }
  const p = d.page;
  const isDone = p.state === 'read' || p.state === 'checked';

  let afterText = '';
  if (p.tier === 'must_know' && p.after) {
    if (p.after.mode === 'self_cleared')
      afterText = 'This one is yours to confirm — reading it is enough, and it will be recorded against your name.';
    else if (p.after.mode === 'pending')
      afterText = `Once you mark this read it goes to <b>${esc(p.after.waiting_hat || 'the hat above you')}</b> for a check. Nobody holds that hat at the moment, so it will sit as outstanding until somebody does. That is not on you.`;
    else if (p.after.mode === 'manager')
      afterText = `Once you mark this read, ${esc((p.after.checkers || []).join(' or ') || 'your manager')} will run through a couple of questions with you.`;
  }

  const resumeTo = isDone ? 0 : savedPos(slug);

  $('screen').innerHTML = `
    ${readBar(readMinutes(p.body))}

    ${resumeTo > 400 ? `<div class="resume noprint" id="resume">
      <span>You were part way through this one.</span>
      <button id="resumeGo" type="button">Pick up where you were</button>
      <button class="ghost x" id="resumeNo" type="button">Start again</button>
    </div>` : ''}

    <div class="readLayout">
      <div class="readMain">
        <article class="doc" id="doc">
          <h1>${esc(p.title)}</h1>
          ${p.summary ? `<p class="lede">${esc(p.summary)}</p>` : ''}
          <div class="docMeta">
            ${p.tier === 'must_know' ? '<span class="chip must">Must know</span>' : ''}
            ${stateChip(p.state)}
            ${p.outside_your_hats ? '<span class="chip outside">Outside your hats</span>' : ''}
            <span>Version ${p.version_no ?? '—'}${p.published_at ? ' · ' + new Date(p.published_at).toLocaleDateString('en-AU', { day:'numeric', month:'long', year:'numeric' }) : ''}</span>
          </div>
          ${glanceCard(p, readMinutes(p.body))}
          ${renderBody(p.body, p.assets, p.jd)}
          <div class="printFoot">Liquid &amp; Larder Handbook · ${esc(p.title)} · version ${p.version_no ?? '—'} · printed ${new Date().toLocaleDateString('en-AU')}</div>
        </article>

        <div class="endCard noprint" id="endCard">
          <div class="h">${isDone ? 'You have read this' : 'Finished reading?'}</div>
          <div class="b">${isDone
            ? (p.state === 'checked' ? 'This is signed off and up to date.' : afterText || 'Marked as read.')
            : (afterText || 'Marking it read records that you have seen this version.')}</div>
          ${isDone ? '' : `<button id="markRead"${p.arm_on_scroll ? ' disabled' : ''}>Mark as read</button>
            ${p.arm_on_scroll ? '<span class="fieldNote" id="armNote" style="margin-left:10px">Keep going — the bar at the top fills as you read.</span>' : ''}`}
          <button class="ghost" onclick="window.print()" style="margin-left:8px">Print</button>
        </div>

        ${p.related?.length ? `<div class="relRow noprint">
          ${p.related.map(r => `<button class="catCard" data-slug="${esc(r.slug)}">
            <span class="n" style="font-size:14px">${esc(r.title)}</span>
            <span class="c">${esc(r.kind === 'prerequisite' ? 'Read this first' : 'Related')}</span>
          </button>`).join('')}</div>` : ''}
      </div>
      <!-- the rail is injected here once the headings have ids -->
    </div>

    `;

  /* The fixed chrome — progress line, sticky header, back to top — is mounted
     on <body>, NOT inside .wrap. .wrap carries `animation:rise .5s ease both`,
     and an element running a transform animation becomes the containing block
     for any fixed-position descendant, so anything fixed inside it positions
     against .wrap rather than the viewport and simply never appears. This cost
     an hour; do not move these back inside #screen. */
  document.getElementById('readerChrome')?.remove();
  const chrome = document.createElement('div');
  chrome.id = 'readerChrome';
  chrome.innerHTML = `
    <div class="readProg" id="readProg"></div>
    <div class="stickyHead noprint" id="stickyHead">
      <div class="in">
        <span class="t">${esc(p.title)}</span>
        ${p.tier === 'must_know' ? '<span class="chip must">Must know</span>' : ''}
        <span class="sp">
          ${isDone ? stateChip(p.state)
            : `<button id="markRead2"${p.arm_on_scroll ? ' disabled' : ''}>Mark as read</button>`}
        </span>
      </div>
    </div>
    <button class="toTop noprint" id="toTop" type="button" title="Back to top" aria-label="Back to top">&uarr;</button>`;
  document.body.appendChild(chrome);

  wireRows($('screen'));
  wireReadBar($('screen'));

  /* ---- the rail. Built from the rendered headings, so it can never disagree
     with the document, and skipped entirely for a policy with fewer than two. */
  const doc = $('doc');
  const heads = anchorHeadings(doc);
  $('screen').querySelector('.readLayout').insertAdjacentHTML('beforeend', railHtml(heads));

  const jump = (id) => {
    const el = document.getElementById(id);
    if (!el) return;
    el.scrollIntoView({ behavior: smoothly(), block:'start' });
    history.replaceState({}, '', location.pathname + location.search + '#' + id);
  };
  const railList = $('railList');
  const links = railList ? [...railList.querySelectorAll('[data-jump]')] : [];
  links.forEach(a => a.addEventListener('click', e => {
    e.preventDefault(); jump(a.dataset.jump);
    if (innerWidth < 1100) railList.classList.remove('open');
  }));
  if ($('railToggle')) $('railToggle').addEventListener('click', () => {
    const open = railList.classList.toggle('open');
    $('railToggle').setAttribute('aria-expanded', String(open));
  });

  /* ---- one scroll listener, one frame, four jobs ---- */
  const prog = $('readProg'), sticky = $('stickyHead'), toTop = $('toTop');
  const armBtn = $('markRead'), armBtn2 = $('markRead2'), armNote = $('armNote');
  let armed = !(!isDone && p.arm_on_scroll);
  let curIdx = 0, ticking = false, lastSave = 0, topH = topbarH();

  const frame = () => {
    ticking = false;
    const r = doc.getBoundingClientRect();
    const h = doc.offsetHeight || 1;

    /* The bar is scaled to the ARMING point, not to the raw height of the
       article, so it reads 0% at the top and hits 100% at the exact moment the
       Mark as read button becomes available. Any other scaling would either
       start part-filled or fill before the button unlocks, and a progress bar
       that lies about the one thing it is there to signal is worse than none.
       A span of zero or less means the whole policy already fits on screen. */
    const span = doc.offsetTop + h - innerHeight - 80;
    prog.style.width = (span <= 0 ? 100 : Math.max(0, Math.min(1, scrollY / span)) * 100).toFixed(1) + '%';
    sticky.classList.toggle('on', r.top < -70);
    toTop.classList.toggle('on', scrollY > innerHeight * 1.2);

    if (links.length) {
      const line = topH + 96;
      let i = 0;
      for (let n = 0; n < heads.length; n++) if (heads[n].el.getBoundingClientRect().top <= line) i = n;
      /* At the foot of the page the last section can never cross the line —
         there is no scroll left to bring it up there — so it would sit
         permanently unhighlighted. Once the page bottoms out, it is current. */
      if (innerHeight + scrollY >= (document.documentElement.scrollHeight - 4)) i = heads.length - 1;
      if (i !== curIdx || !links[curIdx].classList.contains('on')) {
        links.forEach((a, n) => a.classList.toggle('on', n === i));
        curIdx = i;
      }
    }

    /* The arming test is character-for-character the one that was here before.
       Nothing about the rule has moved; only the feedback has. */
    if (!armed && r.bottom - 80 <= innerHeight) {
      armed = true;
      if (armBtn) armBtn.disabled = false;
      if (armBtn2) armBtn2.disabled = false;
      if (armNote) armNote.remove();
    }

    const now = Date.now();
    if (now - lastSave > 900) {
      lastSave = now;
      if (!isDone) { try { localStorage.setItem(POS_KEY(slug), String(Math.round(scrollY))); } catch (e) {} }
    }
  };
  const onScroll = () => { if (!ticking) { ticking = true; requestAnimationFrame(frame); } };

  /* j / k step between sections, gg goes to the top. Ignored while typing, and
     ignored when a modifier is held so browser shortcuts still work. */
  let lastG = 0;
  const onKey = (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable)) return;
    const k = e.key.toLowerCase();
    if ((k === 'j' || k === 'k') && heads.length) {
      e.preventDefault();
      const next = Math.max(0, Math.min(heads.length - 1, curIdx + (k === 'j' ? 1 : -1)));
      jump(heads[next].id);
    } else if (k === 'g') {
      if (lastG && Date.now() - lastG < 700) { scrollTo({ top:0, behavior: smoothly() }); lastG = 0; }
      else lastG = Date.now();
    }
  };

  const onResize = () => { topH = topbarH(); onScroll(); };
  addEventListener('scroll', onScroll, { passive:true });
  addEventListener('resize', onResize, { passive:true });
  addEventListener('keydown', onKey);
  readerTeardown = () => {
    removeEventListener('scroll', onScroll);
    removeEventListener('resize', onResize);
    removeEventListener('keydown', onKey);
    document.getElementById('readerChrome')?.remove();
  };

  toTop.addEventListener('click', () => scrollTo({ top:0, behavior: smoothly() }));

  if ($('resume')) {
    $('resumeGo').addEventListener('click', () => {
      scrollTo({ top: resumeTo, behavior: smoothly() });
      $('resume').remove();
    });
    $('resumeNo').addEventListener('click', () => { clearPos(slug); $('resume').remove(); });
  }

  /* A link straight to a clause wins over anything else. */
  if (location.hash.length > 1) {
    const id = decodeURIComponent(location.hash.slice(1));
    requestAnimationFrame(() => { const el = document.getElementById(id); if (el) el.scrollIntoView({ block:'start' }); });
    if ($('resume')) $('resume').remove();
  }
  frame();

  /* ---- marking it read. Two buttons now do it: the one in the end card and
     the one in the sticky header. They share a handler so they cannot drift. */
  if (!isDone) {
    const markRead = async (btn) => {
      if (armBtn) armBtn.disabled = true;
      if (armBtn2) armBtn2.disabled = true;
      try {
        const r = await api({ action:'mark_read', slug });
        clearPos(slug);
        HOME = await api({ action:'home' });
        render();
        say(r.self_cleared ? 'Read and confirmed — recorded against your name.'
          : r.state === 'waiting_on_a_check'
            ? `Marked read. ${r.waiting_hat ? esc(r.waiting_hat) + ' needs to check you off, and nobody holds that hat yet.' : 'Your manager will check you off.'}`
            : 'Marked as read.');
      } catch (err) {
        if (armBtn) armBtn.disabled = false;
        if (armBtn2) armBtn2.disabled = false;
        say(err.message, 'err');
      }
    };
    if (armBtn)  armBtn.addEventListener('click',  () => markRead(armBtn));
    if (armBtn2) armBtn2.addEventListener('click', () => markRead(armBtn2));
  }
}

/* ================= my team ================= */

async function screenTeam() {
  const d = await api({ action:'team' });
  if (!d.waiting.length) {
    $('screen').innerHTML = `<div class="pageHead"><h2>My team</h2>
      <p>People who have read a must-know page and are waiting on you to check them off.</p></div>
      <div class="card"><div class="empty">Nobody is waiting on you.</div></div>`;
    return;
  }
  $('screen').innerHTML = `
    <div class="pageHead"><h2>My team</h2>
      <p>Run through the questions with them, then sign it off. Every question has to be answered —
         that is the whole point of a check.</p></div>
    <div class="stack">${d.waiting.map((w, i) => `
      <div class="qCard" data-i="${i}">
        <div class="top">
          <div>
            <div class="t">${esc(w.name)}</div>
            <div class="m">${esc(w.title)}${w.read_at ? ' · read ' + new Date(w.read_at).toLocaleDateString('en-AU') : ''}${w.via_hat ? ' · via ' + esc(w.via_hat) : ''}</div>
          </div>
          <span class="chip waiting">Waiting</span>
        </div>
        <div class="askList">
          ${w.questions.map(q => `<label><input type="checkbox" data-q="${esc(q.id)}"> ${esc(q.question)}</label>`).join('')
            || '<div class="fieldNote">This version has no questions, so it cannot be signed off. Add questions and publish a new version.</div>'}
        </div>
        <div class="qActions">
          <button data-sign="${i}"${w.questions.length ? '' : ' disabled'}>Sign off</button>
        </div>
      </div>`).join('')}</div>`;

  $('screen').querySelectorAll('[data-sign]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      const i = +e.currentTarget.dataset.sign;
      const w = d.waiting[i];
      const card = $('screen').querySelector(`[data-i="${i}"]`);
      const answers = [...card.querySelectorAll('[data-q]')]
        .filter(c => c.checked).map(c => ({ question_id: c.dataset.q, ok: true }));
      if (answers.length !== w.questions.length) {
        say('Tick every question before signing off.', 'err');
        return;
      }
      e.currentTarget.disabled = true;
      try {
        await api({ action:'check_off', user_id: w.user_id, policy_id: w.policy_id, answers });
        await screenTeam();
        say(`${w.name} signed off on ${w.title}.`);
      } catch (err) { e.currentTarget.disabled = false; say(err.message, 'err'); }
    });
  });
}

/* ================= admin ================= */

async function screenAdmin(sub, id) {
  if (!META) META = await api({ action:'admin_meta' });
  if (sub === 'edit')    return adminEdit(id);
  if (sub === 'review')  return adminReview(id);
  if (sub === 'rules')   return adminRules();
  if (sub === 'settings')return adminSettings();
  return adminQueue();
}

/* `on` is the tab to highlight. Pass 'none' while editing an EXISTING policy —
   otherwise the nav lights up "New policy" on a screen editing an old one,
   which is exactly the confusion this caused. */
const adminNav = (on) => `<div class="tabs" style="margin-top:-6px">
  ${[['','Queue'],['edit','New policy'],
      ...(HOME?.can?.manage ? [['rules','House rules']] : []),
      ['settings','Settings']].map(([k, l]) =>
    `<button class="${on === k ? 'on' : ''}" data-anav="${k}">${l}</button>`).join('')}
</div>`;
function wireAdminNav(root) {
  root.querySelectorAll('[data-anav]').forEach(b =>
    b.addEventListener('click', () => go({ view:'admin', admin: b.dataset.anav })));
}

async function adminQueue() {
  const [q, list] = await Promise.all([api({ action:'queue' }), api({ action:'policy_list' })]);
  const statusLabel = {
    awaiting_standardisation: 'Waiting to be standardised',
    standardising: 'Being standardised',
    failed: 'Failed',
    submitter_review: 'Yours to review',
    awaiting_approval: 'Waiting on the founders',
    standardised: 'Standardised',
  };
  $('screen').innerHTML = `
    <div class="pageHead"><h2>Handbook admin</h2>
      <p>Anything in flight, and everything published. A Google Doc you submit is turned into a
         page by hand for now — that is deliberate for v1.</p></div>
    ${adminNav('')}

    <div class="card">

const qRowHtml = (v) => `<div class="qRow">
  <input data-q value="${esc(v)}" placeholder="e.g. When do you need a manager to authorise a refund?">
  <button class="ghost" data-delq type="button">Remove</button></div>`;

/* The authoring language.
     ##  heading          ###  small heading        -  bullet        >  callout
     1.  numbered steps (every line in the block must be numbered)
     [copy: Label]   verbatim template with a Copy button
     [table]         pipe-separated, first row is the header
     [def]           term :: meaning, one per line
     [do/dont]       + for do, - for don't
     [more: Label] … [/more]   collapsible, may contain any of the above
   parseBody and blocksToText are exact inverses. THEY MUST STAY THAT WAY: the
   editor loads an existing version by serialising its blocks back into this
   text, so any block type that parseBody can produce but blocksToText cannot
   write is silently destroyed the next time somebody opens the policy. */
function parseBody(text) {
  const src = String(text || '');
  const blocks = [];
  /* [more: …] can span blank lines, so it has to be lifted out before the
     text is split into blank-line-separated chunks. */
  const re = /^[ \t]*\[more(?::[ \t]*([^\]]*))?\][ \t]*\r?\n([\s\S]*?)\r?\n[ \t]*\[\/more\][ \t]*$/gim;
  let last = 0, m;
  while ((m = re.exec(src)) !== null) {
    parseChunks(src.slice(last, m.index), blocks);
    blocks.push({ type:'details', label: (m[1] || '').trim() || null, blocks: parseBody(m[2]) });
    last = re.lastIndex;
  }
  parseChunks(src.slice(last), blocks);
  return blocks;
}

function parseChunks(text, blocks) {
  for (const chunk of String(text || '').split(/\n\s*\n/)) {
    // [copy] keeps everything after the marker verbatim, line breaks and all.
    const copy = chunk.match(/^\s*\[copy(?::\s*([^\]]+))?\]\s*\n?/i);
    if (copy) {
      const bodyText = chunk.slice(copy[0].length).replace(/\s+$/, '');
      if (bodyText) blocks.push({ type:'copy', label: (copy[1] || '').trim() || null, text: bodyText });
      continue;
    }

    const tagged = chunk.match(/^\s*\[(table|def|do\/dont)\]\s*\n?/i);
    const lines = (tagged ? chunk.slice(tagged[0].length) : chunk)
      .split('\n').map(l => l.trim()).filter(Boolean);
    if (!lines.length) continue;

    if (tagged) {
      const kind = tagged[1].toLowerCase();
      if (kind === 'table') {
        const rows = lines.map(l => l.split('|').map(c => c.trim()));
        blocks.push({ type:'table', head: rows[0] || [], rows: rows.slice(1) });
      } else if (kind === 'def') {
        const items = lines.map(l => {
          const i = l.indexOf('::');
          return i < 0 ? { term: l, def: '' }
                       : { term: l.slice(0, i).trim(), def: l.slice(i + 2).trim() };
        });
        blocks.push({ type:'defs', items });
      } else {
        blocks.push({ type:'dodont',
          do:   lines.filter(l => l.startsWith('+ ')).map(l => l.slice(2).trim()),
          dont: lines.filter(l => l.startsWith('- ')).map(l => l.slice(2).trim()) });
      }
      continue;
    }

    // A block where EVERY line is numbered is a procedure, not a paragraph.
    if (lines.length > 1 && lines.every(l => /^\d+[.)]\s+\S/.test(l))) {
      blocks.push({ type:'steps', items: lines.map(l => l.replace(/^\d+[.)]\s+/, '')) });
      continue;
    }

    if (lines.every(l => l.startsWith('- '))) {
      blocks.push({ type:'ul', items: lines.map(l => l.slice(2).trim()) });
    } else for (const line of lines) {
      if (line.startsWith('### ')) blocks.push({ type:'h3', text: line.slice(4).trim() });
      else if (line.startsWith('## ')) blocks.push({ type:'h2', text: line.slice(3).trim() });
      // >> before > , or a quote round-trips into a callout and quietly changes meaning.
      else if (line.startsWith('>> ')) blocks.push({ type:'quote', text: line.slice(3).trim() });
      else if (line.startsWith('> ')) blocks.push({ type:'callout', text: line.slice(2).trim() });
      else if (line.startsWith('- ')) blocks.push({ type:'ul', items:[line.slice(2).trim()] });
      else blocks.push({ type:'p', text: line });
    }
  }
}

/* The exact inverse of parseBody. See the warning above it. */
function blocksToText(blocks, depth) {
  const d = depth || 0;
  return (Array.isArray(blocks) ? blocks : []).map(b => {
    switch (b.type) {
      case 'h2':      return '## ' + (b.text || '');
      case 'h3':      return '### ' + (b.text || '');
      case 'ul':      return (b.items || []).map(i => '- ' + i).join('\n');
      case 'ol':      return (b.items || []).map((i, n) => (n + 1) + '. ' + i).join('\n');
      case 'steps':   return (b.items || []).map((i, n) => (n + 1) + '. ' + i).join('\n');
      case 'callout': return '> ' + (b.text || '');
      case 'quote':   return '>> ' + (b.text || '');
      case 'copy':    return `[copy${b.label ? ': ' + b.label : ''}]\n` + (b.text || '');
      case 'table':   return '[table]\n' + [b.head || [], ...(b.rows || [])]
                        .filter(r => Array.isArray(r) && r.length)
                        .map(r => r.join(' | ')).join('\n');
      case 'defs':    return '[def]\n' + (b.items || [])
                        .map(i => `${i?.term || ''} :: ${i?.def || ''}`).join('\n');
      case 'dodont':  return '[do/dont]\n' + [...(b.do || []).map(i => '+ ' + i),
                                              ...(b.dont || []).map(i => '- ' + i)].join('\n');
      case 'details': return d >= 3 ? '' :
                        `[more${b.label ? ': ' + b.label : ''}]\n${blocksToText(b.blocks, d + 1)}\n[/more]`;
      // hat_jd carries no prose — it is set by the Job description picker and
      // deliberately never round-trips through the text box.
      case 'hat_jd':  return '';
      default:        return b.text || '';
    }
  }).filter(x => x !== '').join('\n\n');
}

async function refreshReach() {
  const box = $('reachBox');
  if (!box) return;
  const scope = $('fScope').value;
  const hat_ids = [...$('screen').querySelectorAll('[data-hat]:checked')].map(c => c.dataset.hat);
  const venue_ids = [...$('screen').querySelectorAll('[data-venue]:checked')].map(c => c.dataset.venue);
  if (scope === 'hats' && !hat_ids.length) {
    box.innerHTML = '<span class="fieldNote">No hats picked yet, so this reaches nobody.</span>';
    box.dataset.count = '0';
    return;
  }
  try {
    const r = await api({ action:'audience_reach', audience_scope: scope, hat_ids, venue_ids });
    box.dataset.count = r.count;
    box.innerHTML = `<div class="big">${r.count} ${r.count === 1 ? 'person' : 'people'}</div>
      <div class="fieldNote" style="margin:2px 0 0">across ${r.venues} venue${r.venues === 1 ? '' : 's'}, of ${r.active_total} active accounts</div>
      <ul>${r.people.slice(0, 40).map(p => `<li>${esc(p.name)}${p.via.length ? ` — ${esc(p.via.join(', '))}` : ''}</li>`).join('')}</ul>
      ${r.people.length > 40 ? `<div class="fieldNote">…and ${r.people.length - 40} more</div>` : ''}
      ${r.no_hat_assignment ? `<div class="warn">${r.no_hat_assignment} active account${r.no_hat_assignment === 1 ? ' has' : 's have'} no hat assigned, so this will never reach them.</div>` : ''}`;
  } catch (e) { box.innerHTML = `<span class="fieldNote">${esc(e.message)}</span>`; }
}

/* Every [bracketed] token still sitting in the text. Some are meant to stay —
   [Guest first name] is a merge field — but [$XX] in a published policy is a
   page that tells somebody the fee is XX dollars. Listing them all and letting
   the approver decide beats guessing which is which. */
function placeholdersIn(body) {
  const found = new Set();
  for (const b of (body?.blocks || [])) {
    for (const t of [b.text || '', ...(b.items || [])]) {
      for (const m of String(t).matchAll(/\[[^\]\n]{1,40}\]/g)) found.add(m[0]);
    }
  }
  return [...found];
}
